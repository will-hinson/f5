name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/f5
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Check version matches tag
        run: |
          version="v$(poetry version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "pyproject version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build sdist and wheel
        run: poetry build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    needs: build-dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/f5-backup
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Check chart versions match tag
        run: |
          expected="${GITHUB_REF_NAME#v}"
          chart="$(helm show chart charts/f5)"
          version="$(awk '/^version:/ {print $2}' <<<"$chart" | tr -d '"')"
          app_version="$(awk '/^appVersion:/ {print $2}' <<<"$chart" | tr -d '"')"
          if [ "$version" != "$expected" ] || [ "$app_version" != "$expected" ]; then
            echo "Chart version=$version appVersion=$app_version, expected $expected"
            exit 1
          fi

      - name: Lint
        run: helm lint charts/f5 --set s3.bucket=lint

      - name: Package
        run: helm package charts/f5 --destination dist

      - name: Push to GHCR
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"   # GHCR paths must be lowercase
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push dist/f5-*.tgz "oci://ghcr.io/${owner}/charts"

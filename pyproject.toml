[project]
name = "f5"
version = "0.1.0"
description = "Automatic backups to S3-compatible storage"
authors = [
    {name = "Will Hinson",email = "will@hinson.sh"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click (>=8.5.0,<9.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "boto3 (>=1.43.105,<2.0.0)"
]

[tool.poetry.scripts]
f5 = "f5.cli:cli"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.9,<0.17.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
